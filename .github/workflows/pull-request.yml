# Checks every pull request without publishing anything.
# The built site is attached to the run as a download, so you can open it and look
# before you merge. (GitHub Pages has no built-in preview for pull requests.)
name: Check pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Stops with a plain message if a link, file or manifest entry is missing.
      - name: Build and check links
        run: node scripts/build.mjs

      # A report, not a gate: style notes never stop a pull request.
      - name: Check HTML
        continue-on-error: true
        run: npx --yes html-validate@9 "dist/**/*.html"

      - name: Keep the built site for download
        uses: actions/upload-artifact@v7
        with:
          name: built-site
          path: dist
          retention-days: 14

  lighthouse:
    name: Lighthouse report (mobile)
    runs-on: ubuntu-latest
    needs: check
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/build.mjs
      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
