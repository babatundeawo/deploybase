# Builds the site, checks it, and publishes it to GitHub Pages.
# Runs on every change to the main branch and on demand from the Actions tab.
# Pull requests use pull-request.yml instead, which builds and checks but never publishes.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the build only needs to read the repository.
permissions:
  contents: read

# Never run two deployments at the same time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - name: Get the files
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Fills in the registry cards, writes the generated files and checks every link.
      # It stops with a plain message if a link, file or manifest entry is missing.
      - name: Build and check links
        run: node scripts/build.mjs

      - name: Set up Pages
        uses: actions/configure-pages@v6

      - name: Package the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publish
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # A report, not a gate: a low score or a style warning never blocks a deployment.
  lighthouse:
    name: Lighthouse report (mobile)
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/build.mjs
      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
